name: ci

# Everything the repository promises, on every pull request and every push to main: types, lint, format, the check that nothing
# account-specific is in the published packages or workflows, the tests, and the pack test that installs the built tarballs with
# npm. The service and CLI tests run against DynamoDB Local (a pinned, checksummed download started by the test setup), which
# needs Java 17 or later; the runner's default JDK serves.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages
        # Dependabot's bodies quote release notes, whose lines run past the 100-column rule.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE" --to "$HEAD"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:strings
      - name: Java for DynamoDB Local
        run: java -version
      - run: pnpm test
      - run: pnpm test:pack

  e2e:
    # The web app in Chromium against the real router and DynamoDB Local: dashboard, board, a drag, a comment, the Agents page.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for the pinned playwright-core
        run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test:e2e
