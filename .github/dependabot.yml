# Weekly, grouped dependency updates. Workflow actions are not here on purpose: every `uses:` is pinned to a SHA that
# test/workflows.test.ts checks against a table, so an action bump is a deliberate edit to both, not a bot's.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Majors of the release tooling are bumped by hand: only the release workflow on GitHub exercises them, and the preset's
      # 10.x ships ES modules only, which the CommonJS plugin that loads it cannot require.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ['version-update:semver-major']
      - dependency-name: '@semantic-release/*'
        update-types: ['version-update:semver-major']
      - dependency-name: semantic-release
        update-types: ['version-update:semver-major']
      - dependency-name: semantic-release-unsquash
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
    groups:
      aws:
        patterns: ['@aws-sdk/*', 'aws-cdk-lib', 'constructs']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
